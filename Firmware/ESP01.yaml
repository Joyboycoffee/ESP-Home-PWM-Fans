substitutions:
  device_name: silent-fan

esphome:
  name: "${device_name}"
  friendly_name: "Silent Fan"
  on_boot:
    priority: 600
    then:
      - logger.log: "Device booting up..."
      - fan.turn_on:
          id: pc_fan
      - logger.log: "Fan set to 100 percent - waiting for application control"

esp8266:
  board: esp01_1m
  restore_from_flash: true

logger:
  level: WARN
  baud_rate: 0

api:       # Native ESPHome API for Python desktop app
  reboot_timeout: 30min
  on_client_connected:
    - logger.log: "Application connected! Taking control of fan speed"
  on_client_disconnected:
    - logger.log: "Application disconnected - setting fans to 100 percent for safety"
    - fan.turn_on: pc_fan

ota:
  platform: esphome

safe_mode:
  disabled: false
  num_attempts: 20
  boot_is_good_after: 5min

wifi:
  ssid: "High Range-2.4G"
  password: "9459127404"
  manual_ip:
    static_ip: 192.168.1.40
    gateway: 192.168.1.1
    subnet: 255.255.255.0
  ap:
    ssid: "PWM-Fan-Setup"
    password: "temp1234"
  power_save_mode: LIGHT
  on_connect:
    - logger.log: "WiFi connected - ready for application control"
  on_disconnect:
    - logger.log: "WiFi disconnected! Setting fans to 100 percent for safety"
    - fan.turn_on: pc_fan
  
captive_portal:

web_server:
  port: 80
  version: 2
  include_internal: true
  auth:
    username: admin
    password: admin

globals:
  - id: min_duty_var
    type: float
    initial_value: '0.72'
  - id: last_duty_var
    type: float
    initial_value: '0.0'

output:
  - platform: esp8266_pwm
    pin: GPIO0
    frequency: 20000 Hz
    id: fan_pwm

switch:
  - platform: template
    name: "Fan Power Override"
    id: fan_power_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:power
    turn_on_action:
      - fan.turn_on: pc_fan
    turn_off_action:
      - fan.turn_off: pc_fan

sensor:
  - platform: wifi_signal
    name: "WiFi Signal Strength"
    id: wifi_signal_sensor
    update_interval: 60s
    unit_of_measurement: dBm
  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    unit_of_measurement: s

fan:
  - platform: speed
    output: fan_pwm
    name: "Silent Fan"
    id: pc_fan
    speed_count: 100
